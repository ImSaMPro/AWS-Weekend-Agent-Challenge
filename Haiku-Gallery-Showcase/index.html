<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Haiku Gallery</title>

  <!-- Google Fonts: a serif for the haiku, a clean sans for the UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* =====================================================================
       RESET & BASE
       ===================================================================== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-top: #1a1a2e;
      --bg-bottom: #16213e;
      --card: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --text-muted: #a0a0b8;
      --accent: #e0c68a;
      --radius: 18px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      line-height: 1.6;
    }

    /* =====================================================================
       LAYOUT
       ===================================================================== */
    .wrapper { width: 100%; max-width: 560px; text-align: center; }

    header { margin-bottom: 2.5rem; }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.4rem;
    }

    /* =====================================================================
       HAIKU CARD
       ===================================================================== */
    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 3rem 2rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      transition: opacity 0.5s ease;
    }

    .haiku {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.9rem;
      font-weight: 500;
      line-height: 1.7;
      color: var(--text);
    }

    .haiku .line { display: block; }

    .meta {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--card-border);
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .meta span { display: inline-flex; align-items: center; gap: 0.35rem; }

    .meta .dot { color: var(--accent); }

    .date {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--accent);
      letter-spacing: 0.03em;
      font-style: italic;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
    }

    /* =====================================================================
       STATES
       ===================================================================== */
    .loading, .error {
      color: var(--text-muted);
      font-size: 0.95rem;
      padding: 2rem;
    }

    .error { color: #f0a0a0; }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--card-border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* =====================================================================
       FOOTER
       ===================================================================== */
    footer {
      margin-top: 2.5rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    footer strong { color: var(--text); font-weight: 600; }

    @media (max-width: 480px) {
      .haiku { font-size: 1.6rem; }
      .card { padding: 2.25rem 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <h1>🖋️ Daily Haiku Gallery</h1>
      <p>A fresh haiku, generated every morning by an AI agent</p>
    </header>

    <!-- Haiku card - populated by JS -->
    <div class="card" id="card">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        Loading today's haiku...
      </div>
    </div>

    <footer>
      Generated by an always-on agent &middot; Powered by <strong>Amazon Bedrock</strong><br />
      Designed &amp; built by <strong>Soumyadeep</strong>
    </footer>
  </div>

  <script>
    'use strict';

    // The Lambda agent writes latest.json to the same S3 bucket / CloudFront
    // origin that serves this page, so we fetch it with a relative path.
    // A cache-busting query param ensures we always get the freshest haiku.
    const DATA_URL = 'latest.json?t=' + Date.now();

    const card = document.getElementById('card');

    async function loadHaiku() {
      try {
        const res = await fetch(DATA_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('No haiku published yet');

        const data = await res.json();
        renderHaiku(data);
      } catch (err) {
        card.innerHTML =
          '<div class="error">' +
          "Today's haiku isn't ready yet.<br />" +
          'Check back after the morning run, or trigger the agent manually.' +
          '</div>';
      }
    }

    function renderHaiku(data) {
      // Build the three-line haiku
      const lines = Array.isArray(data.lines) && data.lines.length
        ? data.lines
        : (data.haiku || '').split('\n').filter(Boolean);

      const haikuHtml = lines
        .map((line) => '<span class="line">' + escapeHtml(line) + '</span>')
        .join('');

      // Capitalize season for display
      const season = data.season
        ? data.season.charAt(0).toUpperCase() + data.season.slice(1)
        : '';

      card.innerHTML =
        '<div class="haiku">' + haikuHtml + '</div>' +
        (data.date ? '<div class="date">' + escapeHtml(data.date) + '</div>' : '') +
        '<div class="meta">' +
          (season ? '<span><span class="dot">&#9679;</span>' + escapeHtml(season) + '</span>' : '') +
          (data.theme ? '<span><span class="dot">&#9679;</span>' + escapeHtml(data.theme) + '</span>' : '') +
        '</div>';
    }

    // Basic HTML escaping to safely render untrusted JSON content
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = String(str);
      return div.innerHTML;
    }

    loadHaiku();
  </script>
</body>
</html>
